 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
   
</head>
<body>

    <div class="card">

        <h1>My Product Store</h1>

        <img
            id="productImage"
            src="images/headphones.jpg"
            alt="Wireless Headphones"
        >

        <h2 id="productName">Wireless Headphones</h2>

        <p id="description">
            Enjoy high-quality sound with these stylish wireless headphones.
        </p>

        <p id="price">Rs. 4,999</p>

        <button id="buyBtn" class="buy">
            Buy Now
        </button>

        <button id="changeImageBtn" class="change">
            Change Product Image
        </button>

        <input
            type="text"
            id="userName"
            placeholder="Enter your name"
        >

        <button id="welcomeBtn" class="welcome">
            Show Welcome
        </button>

        <p id="welcomeMessage"></p>

        <button id="detailsBtn" class="details">
            Change Product Details
        </button>

        <p id="message"></p>

    </div>

     <script src="script.js" defer></script>
</body>
</html>
